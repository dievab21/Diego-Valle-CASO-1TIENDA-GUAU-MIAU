<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
   <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Guau&Miau - Inicio de sesión</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link
        rel="stylesheet"
        href="stylesheet.css">

</head>


<body>

    <header>

        <nav class="navbar">


            <a
                href="index.html"
                class="home-link">

                HOME

            </a>


            <span class="titulo">

                GUAU&MIAU

            </span>


            <a
                href="registro.html"
                class="btn btn-dark btn-sm">

                REGISTRARSE

            </a>


        </nav>

    </header>

    <main>

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-8 col-md-5 col-lg-4">


                    <div class="login-box">

                        <h1 class="titulo-formulario">

                            Inicio de sesión

                        </h1>



                        <form id="loginForm">

                            <div class="mb-3">

                                <label
                                    for="correoLogin"
                                    class="form-label">

                                    USUARIO

                                </label>


                                <input
                                    type="email"
                                    id="correoLogin"
                                    class="form-control"
                                    placeholder="usuario@duoc.cl">

                            </div>

                            <div class="mb-3">

                                <label
                                    for="passwordLogin"
                                    class="form-label">

                                    CONTRASEÑA

                                </label>


                                <input
                                    type="password"
                                    id="passwordLogin"
                                    class="form-control">

                            </div>

                            <div
                                id="mensajeLogin"
                                class="alert d-none"
                                role="alert">

                            </div>

                            <div class="text-center">

                                <button
                                    type="submit"
                                    class="btn btn-dark">

                                    INICIAR SESIÓN

                                </button>

                            </div>

                            <div class="text-center mt-3">

                                <a
                                    href="#"
                                    id="recuperarPassword">

                                    ¿Olvidaste tu contraseña?

                                </a>

                            </div>

                            <p class="text-center mt-3">

                                ¿No tienes una cuenta?

                                <a href="registro.html">

                                    Regístrate

                                </a>

                            </p>


                        </form>


                    </div>

                </div>

            </div>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>
    <script src="login.js"></script>


</body>

</html>
